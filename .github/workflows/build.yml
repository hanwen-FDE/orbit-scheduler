name: Build iOS App

on:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:   # 也支持手动触发
    inputs:
      signed:
        description: '正式签名构建并上传 TestFlight（需要 ASC_* Secrets）'
        type: boolean
        default: false

jobs:
  # 真机未签名 IPA：下载后用 Sideloadly 重签安装到 iPhone
  build-ipa:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.signed) }}
    runs-on: macos-14   # Apple Silicon macOS + Xcode 16（含 iOS 18 SDK）
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择最新 Xcode（含 iOS 18 SDK）
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: 编译真机版（无签名，之后用 Sideloadly 重签）
        run: |
          xcodebuild \
            -project ScheduleAssistant.xcodeproj \
            -scheme ScheduleAssistant \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: 打包 IPA（先 ad-hoc 签名，符合侧载工具预期）
        run: |
          APP="build/Build/Products/Release-iphoneos/ScheduleAssistant.app"

          # 小组件是嵌入式 App Extension；先签扩展，再签主 App，
          # 这样 Sideloadly 重新签名时能保留完整的 PlugIns 结构。
          if [ -d "$APP/PlugIns" ]; then
            find "$APP/PlugIns" -maxdepth 2 -type d -name "*.appex" \
              -exec codesign --force --sign - --generate-entitlement-der {} \;
          fi
          codesign --force --sign - --generate-entitlement-der "$APP"
          codesign -vv "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry ../ScheduleAssistant.ipa Payload
          unzip -l ../ScheduleAssistant.ipa

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleAssistant-ipa
          path: ScheduleAssistant.ipa

  # 模拟器版 .app：上传 Appetize.io 在浏览器中运行
  build-simulator:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.signed) }}
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择最新 Xcode（含 iOS 18 SDK）
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: 编译（iOS 模拟器目标，无需签名）
        run: |
          xcodebuild \
            -project ScheduleAssistant.xcodeproj \
            -scheme ScheduleAssistant \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 .app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/ScheduleAssistant-app.zip" ScheduleAssistant.app

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleAssistant-app
          path: ScheduleAssistant-app.zip

  # 正式签名构建（App Store 分发）并上传到 TestFlight / App Store Connect。
  # 前置条件：账号审核通过后，在仓库 Settings → Secrets → Actions 配置：
  #   ASC_KEY_ID      App Store Connect API Key 的 Key ID
  #   ASC_ISSUER_ID   API Key 的 Issuer ID
  #   ASC_KEY_P8      .p8 密钥文件内容（base64 编码）
  #   ASC_TEAM_ID     开发者 Team ID（developer.apple.com → Membership 详情页）
  # 然后手动触发本工作流并勾选 signed。
  build-signed:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
    runs-on: macos-14
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验签名密钥是否已配置
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_TEAM_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::缺少仓库 Secret：$v（App Store Connect API Key / Team ID，见本 job 顶部注释）"
              missing=1
            fi
          done
          exit $missing

      - name: 写入 App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: 选择最新 Xcode（含 iOS 18 SDK）
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: 编译（无签名归档，签名和描述文件在导出阶段由云端完成）
        run: |
          xcodebuild \
            -project ScheduleAssistant.xcodeproj \
            -scheme ScheduleAssistant \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -archivePath build/Orbit.xcarchive \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: 导出 App Store Connect 分发 IPA
        run: |
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>destination</key><string>export</string><key>teamID</key><string>'"$ASC_TEAM_ID"'</string></dict></plist>' > build/ExportOptions.plist
          xcodebuild -exportArchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -archivePath build/Orbit.xcarchive \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: 上传到 TestFlight / App Store Connect
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/export/*.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: 备份签名 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleAssistant-signed-ipa
          path: build/export/*.ipa
