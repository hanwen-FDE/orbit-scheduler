name: Issue Fixed Distribution Cert

# 一次性任务：用仓库里可用的 ASC API Key 为本地生成的 CSR 签发固定的
# Apple Distribution 证书，回传 .cer（公开材料），并撤销 CI 云签名产生的
# 已无私钥的旧分发证书。私钥始终只在开发者本机，不进入 CI/仓库。
on:
  workflow_dispatch:

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖
        run: python3 -m pip install --quiet pyjwt cryptography requests

      - name: 签发证书并清理死证书
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          CSR_B64: 
        run: |
          python3 - <<'PY'
          import os, base64, datetime, requests, jwt
          API = "https://api.appstoreconnect.apple.com"
          csr = base64.b64decode(os.environ["CSR_B64"]).decode()
          p8 = base64.b64decode(os.environ["ASC_KEY_P8"])
          now = datetime.datetime.now(datetime.timezone.utc)
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now,
                            "exp": now + datetime.timedelta(minutes=15)},
                           p8, algorithm="ES256",
                           headers={"kid": os.environ["ASC_KEY_ID"]})
          s = requests.Session()
          s.headers.update({"Authorization": "Bearer " + tok,
                            "Content-Type": "application/json"})
          r = s.get(API + "/v1/certificates?limit=100")
          r.raise_for_status()
          before = r.json()["data"]
          for c in before:
              a = c["attributes"]
              print("existing:", c["id"], a["certificateType"],
                    a.get("displayName"), a.get("expirationDate", "")[:10])
          r = s.post(API + "/v1/certificates", json={
              "data": {"type": "certificates",
                       "attributes": {"csrContent": csr,
                                      "certificateType": "APPLE_DISTRIBUTION"}}})
          print("create status:", r.status_code)
          r.raise_for_status()
          new = r.json()["data"]
          open("dist.cer", "wb").write(
              base64.b64decode(new["attributes"]["certificateContent"]))
          print("issued:", new["id"], "serial",
                new["attributes"]["serialNumber"], "expires",
                new["attributes"]["expirationDate"][:10])
          for c in before:
              if c["id"] != new["id"] and c["attributes"]["certificateType"] in (
                      "APPLE_DISTRIBUTION", "IOS_DISTRIBUTION"):
                  d = s.delete(API + "/v1/certificates/" + c["id"])
                  print("revoked dead cert:", c["id"],
                        c["attributes"]["certificateType"], "->", d.status_code)
          PY

      - name: 上传证书文件
        uses: actions/upload-artifact@v4
        with:
          name: dist-cert
          path: dist.cer
