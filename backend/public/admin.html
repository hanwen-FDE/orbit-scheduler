<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit 积分管理台</title>
<style>
  :root { --bg:#f5f7fb; --card:#fff; --line:#e4e9f0; --text:#172033; --sub:#748096; --brand:#3277e8; --soft:#eaf2ff; --danger:#d54b59; --ok:#159a6b; --shadow:0 8px 28px #20304d0b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); padding: 28px 22px 54px; max-width: 1240px; margin: 0 auto; }
  h1 { font-size: 23px; margin-bottom: 4px; }
  .sub { color: var(--sub); font-size: 13px; margin-bottom: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card h2 { font-size: 16px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--sub); margin: 8px 0 4px; }
  input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; outline: none; }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--soft); }
  button { background: var(--brand); color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
  button.danger { background: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 100px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--sub); font-weight: 500; }
  .pos { color: var(--ok); font-weight: 600; }
  .neg { color: var(--danger); font-weight: 600; }
  .kv { font-size: 14px; line-height: 1.9; }
  .kv b { display: inline-block; min-width: 110px; color: var(--sub); font-weight: 500; }
  .msg { margin-top: 10px; font-size: 13px; padding: 8px 10px; border-radius: 8px; display: none; }
  .msg.ok { display: block; background: #e6f7ee; color: var(--ok); }
  .msg.err { display: block; background: #fdecec; color: var(--danger); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--sub); cursor: pointer; background: #fff; }
  .hidden { display: none; }
  #logout { float: right; }
  .metrics { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin:20px 0; }
  .metric { background:#fff; border:1px solid var(--line); border-radius:14px; padding:15px; box-shadow:var(--shadow); }
  .metric label { margin:0; color:var(--sub); }
  .metric strong { display:block; font-size:24px; margin-top:9px; }
  .metric small { color:var(--sub); }
  .columns { display:grid; grid-template-columns:360px 1fr; gap:16px; align-items:start; }
  .stack { min-width:0; }
  .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:11px; }
  .table-wrap table { min-width:650px; margin:0; }
  .section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .tabs { display:flex; gap:5px; background:#f1f4f8; padding:4px; border-radius:9px; }
  .tab { background:transparent; color:var(--sub); padding:7px 10px; border-radius:7px; }
  .tab.active { background:#fff; color:var(--brand); box-shadow:0 2px 6px #20304d12; }
  .notice { color:var(--sub); background:#fafbfc; border-radius:10px; padding:10px; font-size:12px; line-height:1.6; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:13px; }
  .empty { text-align:center; color:var(--sub); padding:28px; }
  @media(max-width:950px){.metrics{grid-template-columns:repeat(3,1fr)}.columns{grid-template-columns:1fr}}
  @media(max-width:580px){body{padding:18px 13px 40px}.metrics{grid-template-columns:repeat(2,1fr);gap:8px}.metric{padding:12px}.metric strong{font-size:20px}.card{padding:15px}}
</style>
</head>
<body>
  <div id="loginView">
    <h1>Orbit 积分管理台</h1>
    <p class="sub">管理员登录（与服务器 .env 中 ADMIN_USERNAME / ADMIN_PASSWORD 相同）</p>
    <div class="card">
      <label>用户名</label>
      <input id="loginUser" value="admin" autocomplete="username">
      <label>密码</label>
      <input id="loginPass" type="password" autocomplete="current-password">
      <div class="row"><button id="loginBtn" style="width:100%">登 录</button></div>
      <div id="loginMsg" class="msg"></div>
    </div>
  </div>

  <div id="mainView" class="hidden">
    <button id="logout" class="ghost">退出</button>
    <h1>Orbit 积分管理台</h1>
    <p class="sub">用户、订单、积分账本与 AI 模型使用量</p>

    <div class="metrics">
      <div class="metric"><label>注册用户</label><strong id="mUsers">—</strong><small>普通用户</small></div>
      <div class="metric"><label>订单数</label><strong id="mOrders">—</strong><small>已记录订单</small></div>
      <div class="metric"><label>累计入账</label><strong id="mCredit">—</strong><small>积分</small></div>
      <div class="metric"><label>累计扣减</label><strong id="mDebit">—</strong><small>积分</small></div>
      <div class="metric"><label>近 30 天使用量</label><strong id="mUsage">—</strong><small id="mUsageHint">积分等价量</small></div>
    </div>

    <div class="columns">
    <div class="stack">
    <div class="card">
      <h2>① 查用户</h2>
      <div class="row">
        <input id="qUser" placeholder="输入用户名，如 ceshiyonghu">
        <button id="qBtn">查询</button>
      </div>
      <div class="chips" id="recentChips"></div>
      <div id="userInfo" class="kv hidden"></div>
      <div id="findMsg" class="msg"></div>
    </div>

    <div class="card hidden" id="grantCard">
      <h2>② 加 / 扣积分</h2>
      <div class="row">
        <input id="gPoints" type="number" placeholder="正数加、负数扣，如 50 或 -20">
        <input id="gReason" placeholder="原因，如：测试积分">
        <button id="gBtn">执行</button>
      </div>
      <div id="grantMsg" class="msg"></div>
    </div>

    <div class="card hidden" id="ordersCard">
      <h2>③ 内购订单</h2>
      <div class="row">
        <button id="ordersUserBtn" class="ghost">此用户的订单</button>
        <button id="ordersAllBtn" class="ghost">最近全部订单</button>
      </div>
      <div style="overflow-x:auto"><table id="ordersTable"></table></div>
    </div>

    <div class="card hidden" id="opsCard">
      <div class="section-head"><h2>积分流水</h2><button id="opsBtn" class="ghost">刷新</button></div>
      <div class="table-wrap"><table id="opsTable"></table></div>
    </div>
    </div>
    <div class="stack">
    <div class="card" id="usageCard">
      <div class="section-head"><h2>模型使用量</h2><div class="tabs"><button class="tab active" id="usageUserBtn">当前用户</button><button class="tab" id="usageAllBtn">全部用户</button></div></div>
      <div class="row"><select id="usageRange"><option value="7">近 7 天</option><option value="30" selected>近 30 天</option><option value="90">近 90 天</option></select><button id="usageBtn" class="ghost">刷新使用量</button></div>
      <div class="table-wrap"><table id="usageTable"></table></div><div id="usageMsg" class="notice hidden"></div>
    </div>
    <div class="card"><h2>运营工具</h2><div class="notice">积分流水来自 Orbit 账本；模型使用量来自 OneAPI 消费日志。两者口径不同：积分余额按钱包实时余额计算，使用量按 OneAPI 实际 quota 换算。</div><div class="actions"><button id="refreshBtn" class="ghost">刷新总览</button><button id="shareBtn">分享当前报告图片</button></div><div id="shareMsg" class="msg"></div></div>
    </div>
    </div>
  </div>

<script>
(function () {
  var token = localStorage.getItem('orbit_admin_token') || '';
  var currentUserId = null;
  var usageScope = 'user';
  var $ = function (id) { return document.getElementById(id); };

  function showMsg(el, cls, text) { el.className = 'msg ' + cls; el.textContent = text; }
  function hide(el) { el.classList.add('hidden'); }
  function show(el) { el.classList.remove('hidden'); }

  function setView(loggedIn) {
    if (loggedIn) { hide($('loginView')); show($('mainView')); loadRecentUsers(); loadOverview(); loadUsage(); }
    else { show($('loginView')); hide($('mainView')); }
  }

  async function api(path, method, body) {
    var resp = await fetch(path, {
      method: method || 'GET',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: body ? JSON.stringify(body) : undefined
    });
    var data = null;
    try { data = await resp.json(); } catch (e) { /* 忽略 */ }
    if (resp.status === 401) { token = ''; localStorage.removeItem('orbit_admin_token'); setView(false); throw new Error('登录已过期，请重新登录'); }
    if (!resp.ok) throw new Error((data && data.error && data.error.message) || ('请求失败(' + resp.status + ')'));
    return data;
  }

  // 登录
  $('loginBtn').addEventListener('click', async function () {
    var btn = this; btn.disabled = true;
    try {
      var resp = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: $('loginUser').value.trim(), password: $('loginPass').value })
      });
      var data = await resp.json();
      if (!resp.ok) throw new Error((data.error && data.error.message) || '登录失败');
      if (data.user.role !== 'admin') throw new Error('该账号不是管理员');
      token = data.token;
      localStorage.setItem('orbit_admin_token', token);
      $('loginPass').value = '';
      setView(true);
    } catch (e) { showMsg($('loginMsg'), 'err', e.message); }
    finally { btn.disabled = false; }
  });
  $('loginPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginBtn').click(); });

  $('logout').addEventListener('click', function () {
    token = '';
    localStorage.removeItem('orbit_admin_token');
    setView(false);
  });

  // 最近用户
  async function loadRecentUsers() {
    try {
      var data = await api('/api/admin/recent-users?limit=20');
      var box = $('recentChips'); box.innerHTML = '';
      (data.users || []).forEach(function (u) {
        var chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = u.display_name || u.username;
        chip.onclick = function () { $('qUser').value = u.display_name || u.username; queryUser(); };
        box.appendChild(chip);
      });
    } catch (e) { /* 列表失败不打扰 */ }
  }

  // 查用户
  async function queryUser() {
    var name = $('qUser').value.trim();
    if (!name) { showMsg($('findMsg'), 'err', '请输入用户名'); return; }
    try {
      var data = await api('/api/admin/find?username=' + encodeURIComponent(name));
      currentUserId = data.user.id;
      var info = $('userInfo'); info.innerHTML = '';
      var rows = [
        ['用户 ID', String(data.user.id)],
        ['用户名', String(data.user.username)],
        ['昵称', data.user.display_name || '—'],
        ['状态', data.user.status],
        ['iOS 钱包积分', String(data.ios_wallet.points)],
        ['OneAPI 子账户', data.ios_wallet.oneapi_user_id ? ('#' + data.ios_wallet.oneapi_user_id) : '未开户'],
        ['注册时间', data.user.created_at || '—']
      ];
      rows.forEach(function (r) {
        var p = document.createElement('p');
        var b = document.createElement('b'); b.textContent = r[0];
        p.appendChild(b);
        p.appendChild(document.createTextNode(r[1]));
        info.appendChild(p);
      });
      show(info); show($('grantCard')); show($('ordersCard')); show($('opsCard'));
      showMsg($('findMsg'), 'ok', '已加载：' + (data.user.display_name || data.user.username));
      loadOps(); loadUserOrders(); usageScope = 'user'; $('usageUserBtn').classList.add('active'); $('usageAllBtn').classList.remove('active'); loadUsage();
    } catch (e) { showMsg($('findMsg'), 'err', e.message); }
  }
  $('qBtn').addEventListener('click', queryUser);
  $('qUser').addEventListener('keydown', function (e) { if (e.key === 'Enter') queryUser(); });

  // 加/扣积分
  $('gBtn').addEventListener('click', async function () {
    if (!currentUserId) { showMsg($('grantMsg'), 'err', '请先查询用户'); return; }
    var points = parseInt($('gPoints').value, 10);
    if (!points) { showMsg($('grantMsg'), 'err', '请输入非零整数'); return; }
    var reason = $('gReason').value.trim() || '管理台操作';
    var btn = this; btn.disabled = true;
    try {
      var data = await api('/api/admin/users/' + currentUserId + '/grant', 'POST', { wallet: 'ios', points: points, reason: reason });
      showMsg($('grantMsg'), 'ok', '成功：' + (points > 0 ? '+' : '') + points + ' 积分，当前 OneAPI quota = ' + data.quota_after);
      $('gPoints').value = ''; $('gReason').value = '';
      queryUser(); loadOps();
    } catch (e) { showMsg($('grantMsg'), 'err', e.message); }
    finally { btn.disabled = false; }
  });

  // 订单
  function renderOrders(rows) {
    var t = $('ordersTable');
    if (!rows.length) { t.innerHTML = '<tr><td style="color:#6b7280">暂无订单</td></tr>'; return; }
    var html = '<tr><th>订单</th><th>商品</th><th>积分</th><th>环境</th><th>状态</th><th>时间</th></tr>';
    rows.forEach(function (o) {
      html += '<tr><td>#' + o.id + '</td><td>' + o.product_id + '</td><td class="pos">+' + o.points + '</td><td>' + o.environment + '</td><td>' + o.status + '</td><td>' + (o.created_at || '') + '</td></tr>';
    });
    t.innerHTML = html;
  }
  async function loadUserOrders() {
    try {
      var data = await api('/api/admin/orders?user_id=' + currentUserId + '&limit=50');
      renderOrders(data.orders || []);
    } catch (e) { /* 忽略 */ }
  }
  $('ordersUserBtn').addEventListener('click', loadUserOrders);
  $('ordersAllBtn').addEventListener('click', async function () {
    try {
      var data = await api('/api/admin/orders?limit=50');
      renderOrders(data.orders || []);
    } catch (e) { showMsg($('grantMsg'), 'err', e.message); }
  });

  // 流水
  function renderOps(rows) {
    var t = $('opsTable');
    if (!rows.length) { t.innerHTML = '<tr><td style="color:#6b7280">暂无流水</td></tr>'; return; }
    var html = '<tr><th>流水</th><th>积分</th><th>原因</th><th>quota 前/后</th><th>时间</th></tr>';
    rows.forEach(function (o) {
      var cls = o.delta_points >= 0 ? 'pos' : 'neg';
      var sign = o.delta_points >= 0 ? '+' : '';
      html += '<tr><td>#' + o.id + '</td><td class="' + cls + '">' + sign + o.delta_points + '</td><td>' + o.reason + '</td><td>' + (o.oneapi_quota_before || 0) + ' → ' + (o.oneapi_quota_after || 0) + '</td><td>' + o.created_at + '</td></tr>';
    });
    t.innerHTML = html;
  }
  async function loadOps() {
    if (!currentUserId) return;
    try {
      var data = await api('/api/admin/ops?user_id=' + currentUserId + '&limit=50');
      renderOps(data.ops || []);
    } catch (e) { /* 忽略 */ }
  }
  $('opsBtn').addEventListener('click', loadOps);

  // 总览
  function formatNumber(value) { return Number(value || 0).toLocaleString('zh-CN', { maximumFractionDigits: 2 }); }
  async function loadOverview() {
    try {
      var data = await api('/api/admin/overview');
      $('mUsers').textContent = formatNumber(data.users);
      $('mOrders').textContent = formatNumber(data.orders);
      $('mCredit').textContent = formatNumber(data.credited_points);
      $('mDebit').textContent = formatNumber(data.debited_points);
      $('mUsage').textContent = formatNumber(data.usage_30d.points);
      $('mUsageHint').textContent = data.usage_30d.available ? '近 30 天积分等价量' : 'OneAPI 日志暂不可用';
    } catch (e) { /* 总览失败不影响查用户 */ }
  }

  // OneAPI 模型消费流水
  function renderUsage(rows) {
    var t = $('usageTable');
    if (!rows.length) { t.innerHTML = '<tr><td class="empty">暂无模型使用记录</td></tr>'; return; }
    var html = '<tr><th>时间</th><th>用户</th><th>模型</th><th>输入/输出 Token</th><th>消耗</th><th>耗时</th></tr>';
    rows.forEach(function (o) {
      html += '<tr><td>' + (o.created_at || '') + '</td><td>' + (o.username || '—') + '</td><td>' + (o.model || '—') + '</td><td>' + (o.prompt_tokens || 0) + ' / ' + (o.completion_tokens || 0) + '</td><td class="neg">-' + formatNumber(o.points) + ' 积分</td><td>' + (o.elapsed_ms ? o.elapsed_ms + ' ms' : '—') + '</td></tr>';
    });
    t.innerHTML = html;
  }
  async function loadUsage() {
    var days = parseInt($('usageRange').value, 10) || 30;
    var end = new Date(); var start = new Date(end.getTime() - days * 86400000);
    var query = '?from=' + encodeURIComponent(start.toISOString()) + '&to=' + encodeURIComponent(end.toISOString()) + '&limit=100';
    if (usageScope === 'user' && currentUserId) query += '&user_id=' + currentUserId;
    try {
      var data = await api('/api/admin/usage' + query);
      renderUsage(data.usage || []);
      if (data.available === false) { $('usageMsg').textContent = 'OneAPI 日志暂不可用，本次没有读取到模型使用量。'; show($('usageMsg')); }
      else hide($('usageMsg'));
    } catch (e) { renderUsage([]); showMsg($('usageMsg'), 'err', e.message); show($('usageMsg')); }
  }
  $('usageBtn').addEventListener('click', loadUsage);
  $('usageUserBtn').addEventListener('click', function () { usageScope = 'user'; this.classList.add('active'); $('usageAllBtn').classList.remove('active'); loadUsage(); });
  $('usageAllBtn').addEventListener('click', function () { usageScope = 'all'; this.classList.add('active'); $('usageUserBtn').classList.remove('active'); loadUsage(); });
  $('refreshBtn').addEventListener('click', function () { loadOverview(); loadOps(); loadUsage(); if (currentUserId) { queryUser(); } });

  // 纯浏览器本地生成 PNG，不上传用户信息；支持系统分享或下载。
  $('shareBtn').addEventListener('click', async function () {
    try {
      var canvas = document.createElement('canvas'); canvas.width = 1200; canvas.height = 720;
      var ctx = canvas.getContext('2d'); ctx.fillStyle = '#f5f7fb'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff'; ctx.roundRect(35, 35, 1130, 650, 26); ctx.fill();
      ctx.fillStyle = '#3277e8'; ctx.font = 'bold 34px sans-serif'; ctx.fillText('Orbit 运营报告', 75, 100);
      ctx.fillStyle = '#748096'; ctx.font = '18px sans-serif'; ctx.fillText(new Date().toLocaleString('zh-CN'), 75, 132);
      ctx.fillStyle = '#172033'; ctx.font = 'bold 26px sans-serif'; ctx.fillText(currentUserId ? ($('userInfo').innerText.split('\n')[1] || '当前用户') : '全部用户', 75, 205);
      ctx.font = '18px sans-serif'; ctx.fillStyle = '#748096'; ctx.fillText('积分余额', 75, 250);
      ctx.fillStyle = '#3277e8'; ctx.font = 'bold 50px sans-serif'; ctx.fillText(currentUserId ? $('userInfo').innerText : '—', 75, 310);
      ctx.fillStyle = '#172033'; ctx.font = 'bold 22px sans-serif'; ctx.fillText('运营概况', 430, 205);
      [['注册用户', $('mUsers').textContent], ['订单数', $('mOrders').textContent], ['累计入账', $('mCredit').textContent + ' 积分'], ['累计扣减', $('mDebit').textContent + ' 积分'], ['近30天使用量', $('mUsage').textContent + ' 积分']].forEach(function (a, i) {
        var x = 430 + (i % 2) * 320, y = 235 + Math.floor(i / 2) * 100; ctx.fillStyle = '#f6f8fc'; ctx.roundRect(x, y, 285, 76, 14); ctx.fill(); ctx.fillStyle = '#748096'; ctx.font = '16px sans-serif'; ctx.fillText(a[0], x + 18, y + 27); ctx.fillStyle = '#172033'; ctx.font = 'bold 24px sans-serif'; ctx.fillText(a[1], x + 18, y + 58);
      });
      var blob = await new Promise(function (resolve) { canvas.toBlob(resolve, 'image/png'); });
      var file = new File([blob], 'orbit-report.png', { type: 'image/png' });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ title: 'Orbit 运营报告', files: [file] }); showMsg($('shareMsg'), 'ok', '已打开系统分享'); }
      else { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'orbit-report.png'; a.click(); showMsg($('shareMsg'), 'ok', '报告图片已下载'); }
    } catch (e) { showMsg($('shareMsg'), 'err', '生成分享图片失败：' + e.message); }
  });

  // 初始状态
  setView(!!token);
})();
</script>
</body>
</html>
